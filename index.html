<style>
  /* ── neon border: animated conic-gradient spin ── */
  @property --nb-angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  @keyframes neon-spin { to { --nb-angle: 360deg; } }
  @keyframes blink { 0%,50% { opacity:1 } 51%,100% { opacity:0 } }

  .cyan-glow:hover { box-shadow: 0 0 20px -3px rgba(0, 240, 255, 0.2); }
  .custom-cursor { display:inline-block; width:8px; height:15px; background:#00F0FF; vertical-align:middle; animation: blink 1s step-start infinite; }
  section, article { scroll-margin-top: 4.5rem; }

  /* neon-border card — wraps the real card border with a pseudo spinning gradient */
  .neon-card { position:relative; }
  .neon-card::before {
    content:""; position:absolute; inset:-1px; border-radius:inherit; z-index:0; opacity:0;
    background: conic-gradient(from var(--nb-angle), #00f0ff 0%, #0066ff 40%, #00f0ff 60%, #0066ff 100%);
    animation: neon-spin 2.4s linear infinite;
    transition: opacity .3s ease;
  }
  .neon-card > * { position:relative; z-index:1; }
  .neon-card::after {
    content:""; position:absolute; inset:0px; border-radius:inherit; z-index:0;
    background: #111822; /* surface-card */
  }
  .neon-card:hover::before { opacity:1; }
  /* inner content must sit above the ::after fill */
  .neon-card > * { position:relative; z-index:2; }

  /* progress bar: cyan→blue gradient */
  #progress {
    background: linear-gradient(90deg, #00f0ff 0%, #0066ff 60%, #00f0ff 100%);
    background-size: 200% 100%;
    animation: prog-shift 3s linear infinite;
  }
  @keyframes prog-shift { 0%{background-position:0% 0%} 100%{background-position:200% 0%} }

  /* hero: full-width fiber background */
  #hero-wrap { position:relative; min-height:100vh; display:flex; align-items:center; overflow:hidden; background:#05060c; padding-top:3.5rem; }
  #hero-wrap canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #hero-wrap .fade { position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(90deg, rgba(11,15,20,.88) 0%, rgba(11,15,20,.45) 45%, transparent 72%),
               linear-gradient(0deg, #0B0F14 0%, transparent 22%); }
  #hero-wrap .inner { position:relative; width:100%; }
  /* hero photo: stands at the bottom right, fades out at the bottom and at its cut-off left edge */
  #hero-wrap .hero-photo { position:absolute; bottom:0; right:max(2vw, calc((100vw - 1120px) / 2)); height:min(86vh, 860px); width:auto;
    pointer-events:none; filter:drop-shadow(0 0 28px rgba(0,184,239,.22));
    -webkit-mask-image:linear-gradient(to top, transparent 0%, #000 22%), linear-gradient(to right, transparent 0%, #000 14%);
    -webkit-mask-composite:source-in;
    mask-image:linear-gradient(to top, transparent 0%, #000 22%), linear-gradient(to right, transparent 0%, #000 14%);
    mask-composite:intersect;
    animation:heroPhotoIn 1.1s cubic-bezier(.2,.7,.2,1) .35s both; }
  @keyframes heroPhotoIn { from { opacity:0; transform:translateY(28px); } to { opacity:1; transform:none; } }
  @media (max-width: 767px) {
    /* phones: name sits in the top half, photo stands in the bottom half so they don't overlap */
    #hero-wrap { align-items:flex-start; }
    #hero-wrap .hero-photo { right:-6%; height:50vh; }
    #hero.py-space-2xl { padding-top:3rem; }
  }
  @media (prefers-reduced-motion: reduce) { #hero-wrap .hero-photo { animation:none; } }
  @media (max-width: 767px) {
    #hero-wrap .fade { background:linear-gradient(0deg, #0B0F14 0%, rgba(11,15,20,.6) 30%, rgba(11,15,20,.6) 75%, rgba(11,15,20,.2) 100%); }
  }

  /* hero: 3D circuit board (wide screens). Darkening only behind the name so the board stays visible elsewhere */
  #hero-wrap.cx-on #fibers { display:none; }
  #hero-wrap #circuit { opacity:0; transition:opacity 1s ease; }
  #hero-wrap #circuit.on { opacity:1; }
  #hero-wrap.cx-on .fade { background:radial-gradient(ellipse 44% 50% at 24% 54%, rgba(11,15,20,.82) 0%, rgba(11,15,20,.5) 55%, transparent 100%),
    linear-gradient(0deg, #0B0F14 0%, transparent 18%); }
  #hero-wrap.cx-on { cursor:grab; }
  #hero-wrap.cx-on.cx-drag { cursor:grabbing; }
  #hero-wrap.cx-on.cx-hot { cursor:pointer; }
  #hero-wrap.cx-on #hero, #hero-wrap.cx-on #hero :not(a):not(a *) { cursor:inherit; }
  .cx-tip { position:absolute; left:0; top:0; z-index:6; pointer-events:none; white-space:nowrap; opacity:0; transition:opacity .15s;
    padding:.45rem .8rem; border-radius:.4rem; border:1px solid rgba(0,240,255,.4); background:rgba(8,14,20,.92);
    box-shadow:0 0 18px rgba(0,102,255,.25); }
  .cx-tip.on { opacity:1; }
  .cx-tip b { display:block; font-family:"JetBrains Mono","Noto Sans Thai",monospace; font-weight:700; font-size:14px; line-height:1.5; color:#F1F5F9; }
  .cx-tip span { display:block; font-family:"Noto Sans Thai","Inter",sans-serif; font-size:13px; line-height:1.5; color:#94A3B8; }
  .cx-hint { position:absolute; z-index:6; left:max(1.5rem, calc((100% - 1120px) / 2 + 1.5rem)); bottom:1.75rem; pointer-events:none;
    font-family:"JetBrains Mono","Noto Sans Thai",monospace; font-size:13px; line-height:1.5; color:#94A3B8; transition:opacity .6s; }
  .cx-hint b { color:#00f0ff; font-weight:500; }
  .cx-hint.gone { opacity:0; }

  /* hologram hero (HOLO): grid + a dotted globe in spinning rings, standing behind the photo */
  #hero-wrap.holo-on #fibers { display:none; }
  #hero-wrap.holo-on { background:radial-gradient(ellipse 60% 70% at 72% 48%, rgba(0,102,255,.16), transparent 70%), #05060c; }
  .holo-grid { position:absolute; inset:0; pointer-events:none; opacity:.55;
    background:linear-gradient(rgba(0,240,255,.06) 1px, transparent 1px) 0 0 / 44px 44px, linear-gradient(90deg, rgba(0,240,255,.06) 1px, transparent 1px) 0 0 / 44px 44px;
    -webkit-mask-image:radial-gradient(ellipse at 70% 50%, #000 15%, transparent 75%); mask-image:radial-gradient(ellipse at 70% 50%, #000 15%, transparent 75%); }
  .holo-core { position:absolute; pointer-events:none; aspect-ratio:1; transform:translate(-50%, -50%); }
  .holo-core svg, .holo-core canvas { position:absolute; left:50%; top:50%; transform:translate(-50%, -50%); }
  .holo-core svg { width:100%; height:100%; overflow:visible; }
  #hero-wrap .holo-core canvas { inset:auto; left:50%; top:50%; width:64%; height:64%; }   /* beats the full-cover "#hero-wrap canvas" rule */
  .holo-r1 { animation:holoSpin 40s linear infinite; transform-origin:50% 50%; }
  .holo-r2 { animation:holoSpin 24s linear infinite reverse; transform-origin:50% 50%; }
  @keyframes holoSpin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .holo-r1, .holo-r2 { animation:none; } }

  /* text animations on the frames (textFx). The resting state is always the plain, readable text. */
  .fx-caret::after { content:""; display:inline-block; width:.45em; height:.95em; margin-left:2px; vertical-align:-.1em; background:#00f0ff; animation:blink 1s step-start infinite; }
  .fx-w { display:inline-block; }
  .st-hl .fx-w { background:inherit; -webkit-background-clip:text; background-clip:text; color:transparent; }
  .fx-words.fx-play .fx-w { animation:fxWord .7s cubic-bezier(.2,.7,.2,1) both; animation-delay:calc(var(--i) * 70ms); }
  .fx-scan { position:relative; }
  .fx-scan.fx-play { animation:fxScanClip 1.1s cubic-bezier(.6,0,.3,1) both; }
  .fx-scan.fx-play::after { content:""; position:absolute; top:-4%; bottom:-4%; width:3px; background:#00f0ff; box-shadow:0 0 16px #00f0ff, 0 0 40px #0066ff; animation:fxScanBar 1.1s cubic-bezier(.6,0,.3,1) both; }
  .st-hl.fx-shine { background-image:linear-gradient(100deg,#00f0ff 0%,#38bdf8 35%,#fff 50%,#38bdf8 65%,#0066ff 100%); background-size:250% 100%; animation:fxShine 1.5s ease-out both; }
  .fx-flicker.fx-play { animation:fxFlick 1.6s linear both; }
  .fx-glitch { position:relative; display:inline-block; }
  .fx-glitch::before, .fx-glitch::after { content:attr(data-text); position:absolute; left:0; top:0; right:0; padding:inherit; opacity:0; pointer-events:none;
    background:none; -webkit-background-clip:border-box; background-clip:border-box; filter:none; }
  .fx-glitch::before { color:rgba(255,0,90,.75); } .fx-glitch::after { color:#00f0ff; }
  .fx-glitch.fx-play { animation:fxJitter .9s steps(1) both; }
  .fx-glitch.fx-play::before { animation:fxGlA .9s steps(1) both; } .fx-glitch.fx-play::after { animation:fxGlB .9s steps(1) both; }
  .fx-lines.fx-play > * { animation:fxLine .5s ease-out both; animation-delay:calc(var(--i) * 140ms + .2s); }
  /* a frame "arms" its text as it starts coming in: the animated parts wait hidden until their effect starts,
     so the text doesn't show first and then animate again */
  .fx-armed .fx-scan:not(.fx-play), .fx-armed .fx-flicker:not(.fx-play), .fx-armed .fx-glitch:not(.fx-play),
  .fx-armed .fx-words:not(.fx-play) .fx-w, .fx-armed .fx-lines:not(.fx-play) > *, .fx-armed [data-fx-text]:not(.fx-typed) { opacity:0; }
  @keyframes fxWord { from { opacity:0; transform:translateY(.55em); filter:blur(8px); } to { opacity:1; transform:none; filter:none; } }
  @keyframes fxScanClip { from { clip-path:inset(-10% 100% -10% 0); } to { clip-path:inset(-10% -2% -10% 0); } }
  @keyframes fxScanBar { from { left:0; opacity:1; } 85% { opacity:1; } to { left:100%; opacity:0; } }
  @keyframes fxShine { from { background-position:100% 0; } to { background-position:0 0; } }
  @keyframes fxFlick { 0% { opacity:0; } 8% { opacity:.8; } 12% { opacity:.1; } 20% { opacity:.9; } 24% { opacity:.3; } 40% { opacity:1; } 46% { opacity:.5; } 52%, 100% { opacity:1; } }
  @keyframes fxJitter { 0% { transform:translate(2px,0); } 15% { transform:translate(-3px,1px); } 30% { transform:translate(1px,-1px); } 45% { transform:translate(-1px,0); } 60%, 100% { transform:none; } }
  @keyframes fxGlA { 0% { opacity:1; transform:translate(-4px,0); clip-path:inset(10% 0 60% 0); } 20% { clip-path:inset(55% 0 20% 0); transform:translate(5px,0); } 40% { clip-path:inset(30% 0 45% 0); transform:translate(-3px,0); } 60% { clip-path:inset(70% 0 5% 0); transform:translate(2px,0); } 80%, 100% { opacity:0; } }
  @keyframes fxGlB { 0% { opacity:1; transform:translate(4px,0); clip-path:inset(60% 0 15% 0); } 20% { clip-path:inset(5% 0 70% 0); transform:translate(-5px,0); } 40% { clip-path:inset(40% 0 35% 0); transform:translate(3px,0); } 60% { clip-path:inset(15% 0 65% 0); transform:translate(-2px,0); } 80%, 100% { opacity:0; } }
  @keyframes fxLine { from { opacity:0; transform:translateX(-14px); filter:blur(4px); } to { opacity:1; transform:none; filter:none; } }
  @media (prefers-reduced-motion: reduce) { [class*="fx-"], [class*="fx-"]::before, [class*="fx-"]::after, .fx-w, .fx-lines > * { animation:none !important; } }

  /* frames: light-speed streaks for warp / dive */
  .hs-warp { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; display:none; }

  /* projects tunnel (TUNNEL): one WebGL tunnel behind all frames; project frames turn see-through and their
     pictures hang in the tunnel instead of the tilted gallery */
  #tun-gl { position:absolute; inset:0; width:100%; height:100%; z-index:0; display:none; }
  html.tun-on .hs-panel.hs-proj { background:transparent; }
  html.tun-on .hs-panel.hs-proj > .panel-bg, html.tun-on .hs-proj .st-gallery { display:none; }  /* the project text becomes a hologram panel too: angled toward you like a screen on a curved wall, tilting with
     the pointer (--hx/--hy, set by the tunnel), floating, with scanlines, a light band, glowing edge and corner brackets */
  html.tun-on .hs-proj .st-split { transform:perspective(1400px) rotateY(calc(12deg + var(--hx, 0) * 5deg)) rotateX(calc(var(--hy, 0) * -3deg));
    transform-origin:0% 50%; transition:none; }   /* no scroll-reveal transition: the tilt changes every frame */
  html.tun-on .hs-proj .st-text-col { position:relative; padding:1.25rem 1.5rem 1.4rem; border:1px solid rgba(0,240,255,.35); border-radius:.5rem;
    background:linear-gradient(100deg, rgba(0,30,46,.86), rgba(3,14,24,.66) 70%, rgba(0,40,60,.5));
    box-shadow:0 0 40px rgba(0,170,255,.18), inset 0 0 40px rgba(0,240,255,.07); }   /* no backdrop-filter: inside a 3D tilt it makes Chrome drop parts of the text */
  html.tun-on .hs-proj.st-play .st-text-col, html.tun-on .hs-proj .st-play .st-text-col { animation:holoOn .9s steps(1) both, holoBob 6s ease-in-out 1s infinite; }
  html.tun-on .hs-proj .st-text-col::before { content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; z-index:3; mix-blend-mode:screen;
    background:linear-gradient(180deg, transparent 0%, rgba(0,240,255,.08) 46%, rgba(160,250,255,.16) 50%, transparent 54%) 0 0 / 100% 300% no-repeat,
      repeating-linear-gradient(0deg, rgba(0,240,255,.05) 0 1px, transparent 1px 3px);
    animation:holoBand 5.5s linear infinite; }
  html.tun-on .hs-proj .st-text-col::after { content:""; position:absolute; inset:-5px; pointer-events:none; z-index:3;
    background:linear-gradient(#00f0ff,#00f0ff) 0 0 / 22px 2px no-repeat, linear-gradient(#00f0ff,#00f0ff) 0 0 / 2px 22px no-repeat,
      linear-gradient(#00f0ff,#00f0ff) 100% 0 / 22px 2px no-repeat, linear-gradient(#00f0ff,#00f0ff) 100% 0 / 2px 22px no-repeat,
      linear-gradient(#00f0ff,#00f0ff) 0 100% / 22px 2px no-repeat, linear-gradient(#00f0ff,#00f0ff) 0 100% / 2px 22px no-repeat,
      linear-gradient(#00f0ff,#00f0ff) 100% 100% / 22px 2px no-repeat, linear-gradient(#00f0ff,#00f0ff) 100% 100% / 2px 22px no-repeat;
    filter:drop-shadow(0 0 6px rgba(0,240,255,.8)); }
  html.tun-on .hs-proj .st-text-col :is(p, li, .st-sub) { text-shadow:0 0 14px rgba(0,200,255,.28); }
  @keyframes holoOn { 0% { opacity:.1; } 12% { opacity:.85; } 20% { opacity:.25; } 32% { opacity:1; } 40% { opacity:.55; } 52%, 100% { opacity:1; } }
  @keyframes holoBob { 50% { translate:0 -8px; } }
  @keyframes holoBand { from { background-position:0 115%, 0 0; } to { background-position:0 -15%, 0 0; } }
  @media (prefers-reduced-motion: reduce) { html.tun-on .hs-proj .st-text-col, html.tun-on .hs-proj .st-text-col::before { animation:none !important; } }
  .tun-hint { position:absolute; left:50%; bottom:22px; transform:translateX(-50%); z-index:50; pointer-events:none; white-space:nowrap;
    font-family:"JetBrains Mono","Noto Sans Thai",monospace; font-size:13px; line-height:1.5; color:#CBD5E1; padding:.35rem .9rem; border-radius:.35rem;
    background:rgba(5,9,14,.75); border:1px solid rgba(0,240,255,.25); opacity:0; transition:opacity .4s; }
  .tun-hint b { color:#00f0ff; font-weight:500; }
  .tun-hint.on { opacity:1; }

  /* hero intro: lines slide up once on load */
  .intro > * { opacity:0; transform:translateY(18px); animation:introUp .8s cubic-bezier(.2,.7,.2,1) forwards; }
  .intro > *:nth-child(2){animation-delay:.12s} .intro > *:nth-child(3){animation-delay:.24s}
  .intro > *:nth-child(4){animation-delay:.36s} .intro > *:nth-child(5){animation-delay:.48s}
  @keyframes introUp { to { opacity:1; transform:none; } }

  /* scroll tracking: progress bar + active nav link */
  #progress { position:fixed; top:56px; left:0; right:0; height:2px; z-index:60; pointer-events:none;
    transform-origin:0 50%; transform:scaleX(0); box-shadow:0 0 12px rgba(0,102,255,.5), 0 0 8px rgba(0,240,255,.6); }
  .nav-link { position:relative; }
  .nav-link::after { content:""; position:absolute; left:0; right:0; bottom:-6px; height:1px; background:#00f0ff;
    transform:scaleX(0); transform-origin:0 50%; transition:transform .3s ease; }
  .nav-link.active { color:#00f0ff; text-shadow: 0 0 10px rgba(0,102,255,.6); }
  .nav-link.active::after { transform:scaleX(1); background: linear-gradient(90deg, #00f0ff, #0066ff); }
  #mobile-nav .nav-link::after { display:none; }
  #mobile-nav .nav-link.active::before { content:"> "; }

  /* frames (desktop): stacked full-screen frames, scroll drives the transition between them */
  #hs { position:relative; flex:none; }
  #hs-sticky { position:sticky; top:0; height:100vh; overflow:hidden; background:#0B0F14; }
  .hs-panel { position:absolute; inset:0; display:flex; align-items:center; padding-top:56px; overflow:hidden;
    background:#0B0F14; transform-origin:50% 50%; will-change:transform,clip-path,opacity; }
  .hs-panel.hs-hero { padding-top:0; }
  /* no sideways scroll: full-bleed backgrounds use 100vw (includes the scrollbar), and edge glows / tilted
     pictures poke a little past the screen edge on phones */
  html, body { overflow-x:clip; }
  .hs-inner { position:relative; z-index:1; width:100%; max-width:1120px; margin:0 auto; padding:0 1.5rem; will-change:transform,opacity; }
  .hs-panel > .panel-bg { position:absolute; inset:0; z-index:0; }
  .hs-hero .hs-inner { max-width:none; padding:0; height:100%; }
  .hs-hero #hero-wrap { min-height:0; height:100%; }
  .hs-dim { position:absolute; inset:0; z-index:2; background:#05070a; opacity:0; pointer-events:none; }
  .hs-panel section { padding-top:0 !important; padding-bottom:0 !important; border-top:0 !important; margin-bottom:0 !important; }
  .hs-ring { position:absolute; left:50%; top:55%; transform:translate(-50%,-50%); border-radius:50%; display:none; pointer-events:none;
    border:1px solid rgba(0,200,255,.8); box-shadow:0 0 28px rgba(0,102,255,.5), 0 0 14px rgba(0,240,255,.4), inset 0 0 20px rgba(0,102,255,.2); }
  /* "drop" transition: falling water drop (teardrop = square with one sharp corner, turned 45deg) */
  .hs-drop { position:absolute; left:50%; top:0; width:22px; height:22px; margin-left:-11px; display:none; pointer-events:none;
    border-radius:0 50% 50% 50%; background:radial-gradient(circle at 65% 65%, #e0fdff 0%, #00f0ff 35%, #0066ff 100%);
    box-shadow:0 0 18px rgba(0,240,255,.7), 0 0 40px rgba(0,102,255,.5); }
  /* "split" transition: glowing edges of the opening */
  .hs-line { position:absolute; left:0; right:0; height:2px; margin-top:-1px; display:none; pointer-events:none;
    background:linear-gradient(90deg, transparent, #00f0ff 20%, #0066ff 50%, #00f0ff 80%, transparent);
    box-shadow:0 0 16px rgba(0,240,255,.6), 0 0 32px rgba(0,102,255,.4); }
  .hs-snap { position:absolute; left:0; width:1px; height:1px; scroll-snap-align:start; pointer-events:none; }
  html.hs-on.hs-snapping { scroll-snap-type:y proximity; }

  /* hero: Thai name + tagline */
  .hero-thai { font-family:"Noto Sans Thai","Inter",sans-serif; font-weight:600; font-size:clamp(30px,5vw,76px); line-height:1.35; color:#F1F5F9; }
  .hero-tag { font-family:"Noto Sans Thai","Inter",sans-serif; font-weight:700; font-size:clamp(26px,4vw,62px); line-height:1.4; }

/* ---------- renderer (no need to edit below) ---------- */
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const has = (v) => Array.isArray(v) ? v.length > 0 : String(v ?? "").trim() !== "";
const ext = (url) => /^https?:/i.test(url) ? ' target="_blank" rel="noopener noreferrer"' : "";
const icon = (name, size = 18) => `<span class="material-symbols-outlined text-[${size}px]" aria-hidden="true">${esc(name)}</span>`;

// full-frame moving grid layer that sits behind a section's content (frames move it to cover the whole screen)
const GRID_BG = GRID.enabled ? `<div class="panel-bg grid-bg" aria-hidden="true"><div class="grid-hover"></div></div>` : "";

function imgSlot(src, alt, cls, hint, eager) {
  const ph = `<div class="w-full h-full flex items-center justify-center p-4 text-center border border-dashed border-border-subtle bg-surface-dim text-text-muted font-label-mono text-caption">add ${esc(hint || "image")}</div>`;
  if (!has(src)) return ph;
  return `<img src="${esc(src)}" alt="${esc(alt)}" class="${cls}"${eager ? "" : ' loading="lazy"'} data-ph="${esc(ph.replace("add " + esc(hint || "image"), "add " + esc(src)))}" onerror="this.outerHTML=this.dataset.ph">`;
}

const sectionHead = (n, label) => `
  <div class="flex items-center gap-3 mb-10">
    <h2 class="font-headline-lg text-headline-lg text-text-primary tracking-tight">${String(n).padStart(2, "0")}. // ${esc(label)}</h2>
    <div class="h-px flex-1 bg-border-subtle"></div>
  </div>`;

const L = SITE.links;
const navLink = "text-text-secondary font-label-mono text-label-mono transition-colors duration-200 hover:text-primary-container";
const chip = "px-3 py-1.5 rounded-DEFAULT bg-border-subtle/40 border border-border-subtle text-text-primary font-label-mono text-label-mono";

function heroHTML() {
  return `
  <section class="intro py-space-2xl flex flex-col justify-center items-start" id="hero">
    <h1 class="font-hero-name-mobile text-hero-name-mobile md:font-hero-name md:text-hero-name text-text-primary uppercase mb-4 md:mb-5 tracking-tighter">${esc(SITE.name)}</h1>
    ${has(SITE.fullName) ? `<p class="hero-thai">${esc(SITE.fullName)}</p>` : ""}
    <p class="hero-tag"><span class="st-hl">${esc(SITE.tagline)}</span></p>
    ${stackHTML()}
    ${SITE.heroGithub && has(L.github) ? `<div class="flex flex-wrap items-center gap-4 mt-8">
      <a class="inline-flex items-center justify-center gap-1.5 px-6 py-3 rounded-DEFAULT border border-border-subtle hover:border-primary-container hover:text-primary-container hover:bg-primary-container/5 text-text-primary font-label-mono text-label-mono transition-all duration-150 active:scale-95" href="${esc(L.github)}"${ext(L.github)}><span>GitHub</span><span class="text-xs">↗</span></a>
    </div>` : ""}
  </section>`;
}

// tech-stack list for screen readers (STACK); the logos themselves are drawn by heroStack() round the photo
function stackHTML() {
  const list = STACK.enabled ? STACK.logos.filter((l) => STACK_ICONS[l.icon]) : [];
  return list.length ? `<ul class="sr-only" aria-label="Tech stack">${list.map((l) => `<li>${esc(l.label)}</li>`).join("")}</ul>` : "";
}

// escape, turn "\n" into <br>, wrap the highlight part in the gradient span
function rich(text, hl) {
  let out = esc(text);
  if (has(hl)) out = out.split(esc(hl)).join(`<span class="st-hl">${esc(hl)}</span>`);
  return out.replace(/\n/g, "<br>");
}

// where each tilted picture sits in the gallery (left/top in %, tilt in degrees), by picture count
const GALLERY_SPOTS = {
  1: [{ x: 6, y: 28, r: -3, w: 88 }],   // a lone picture gets more room
  2: [{ x: 0, y: 12, r: -5 }, { x: 30, y: 44, r: 4 }],
  3: [{ x: 0, y: 2, r: -6 }, { x: 30, y: 28, r: 5 }, { x: 8, y: 55, r: -2 }]
};
function galleryHTML(pics, title) {
  const spots = GALLERY_SPOTS[Math.min(3, pics.length)];
  return `<div class="st-gallery">${pics.map((src, i) => {
    const t = spots[i % spots.length];
    return `<figure class="st-pic" style="left:${t.x}%;top:${t.y}%;${t.w ? `width:${t.w}%;` : ""}--r:${t.r}deg;--i:${i};z-index:${i + 1}">${imgSlot(src, `${title} ${i + 1}`, "block w-full h-auto", "image", true)}</figure>`;   // eager: no pop-in mid-animation
  }).join("")}</div>`;
}

// list = which frames, prefix = their id (story-1, story-2 … / after-1 …)
function storyHTML(list = SITE.story, prefix = "story") {
  return (list || []).map((s, i) => {
    let body;
    if (s.kind === "title") {
      body = `<h2 class="st-title${s.muted ? " muted" : ""}">${rich(s.text, s.highlight)}</h2>`;
    } else if (s.kind === "project") {
      const pics = has(s.gallery) ? s.gallery : null;
      const split = !!pics;   // with pictures: text on the left, tilted gallery on the right
      const text = `
        ${"icon" in s ? `<div class="st-icon">${imgSlot(s.icon, s.title + " icon", "w-full h-full object-cover", "icon", true)}</div>` : ""}
        ${has(s.eyebrow) ? `<div class="st-eyebrow">${esc(s.eyebrow)}</div>` : ""}
        <h2 class="st-title">${rich(s.title, s.highlight)}</h2>
        ${has(s.subtitle) ? `<p class="st-sub">${rich(s.subtitle)}</p>` : ""}
        ${s.award && has(s.award.title) ? `<div class="st-award"><span class="st-award-icon">${icon(s.award.icon || "emoji_events", 22)}</span>
          <span><b>${esc(s.award.title)}</b>${has(s.award.event) ? `<small>${esc(s.award.event)}</small>` : ""}</span></div>` : ""}
        ${has(s.text) ? `<div class="st-card neon-card"><p>${rich(s.text)}</p></div>` : ""}
        <div class="st-body">
          ${has(s.points) ? `<ul class="st-points">${s.points.map((p) => `<li>${rich(p)}</li>`).join("")}</ul>` : ""}
          ${has(s.tags) ? `<div class="flex flex-wrap gap-2 mt-6">${s.tags.map((t) => `<span class="${chip}">${esc(t)}</span>`).join("")}</div>` : ""}
          ${has(s.links) ? `<div class="st-links">${s.links.filter((l) => has(l.url)).map((l) => `
            <a class="st-link" href="${esc(l.url)}"${ext(l.url)}>
              ${has(l.qr) ? `<img src="${esc(l.qr)}" alt="QR: ${esc(l.label)}" onerror="this.remove()">` : ""}
              <span><b>${esc(l.label)}</b><small>${esc(new URL(l.url).hostname)} ↗</small></span>
            </a>`).join("")}</div>` : ""}

// certificates from the same event (same "event") stand together: one stop in the hall, one card on phones.
// Numbers (CERT 01..) follow the order on screen.
function certGroups() {
  const out = [], by = {};
  ((SITE.certs || {}).items || []).forEach((it) => {
    const g = it.event && by[it.event];
    if (g) g.items.push({ ...it }); else { const ng = { event: it.event || "", items: [{ ...it }] }; out.push(ng); if (it.event) by[it.event] = ng; }
  });
  let no = 0; out.forEach((g) => g.items.forEach((it) => (it.no = ++no)));
  return out;
}
// "CERT 01 / 13 · 2569 ★ AWARD", a pair = "CERT 01–02 / 13 ..."
function certNo(g, total) {
  const two = (i) => String(i).padStart(2, "0"), a = g.items[0], z = g.items[g.items.length - 1];
  return `CERT ${two(a.no)}${z !== a ? "–" + two(z.no) : ""}${total ? " / " + two(total) : ""}${has(a.year) ? " · " + esc(a.year) : ""}` +
    (g.items.some((x) => x.award) ? ` <b class="hall-award">★ AWARD</b>` : "");
}

  const c = SITE.certs || {}, groups = certGroups();

          ${pair ? `<ul class="hall-list">${g.items.map((x) => `<li>${x.award ? "★ " : ""}${esc(x.title)}</li>`).join("")}</ul>` : ""}

  return `
  <section class="hall" id="certs">

/* ---------- hero fiber background (WebGL) ---------- */
function ghostFibers(canvas, o) {
  const gl = canvas.getContext("webgl", { antialias: false, alpha: false });
  if (!gl) { canvas.style.background = `radial-gradient(ellipse at 70% 50%, ${o.glowColor}, #05060c 70%)`; return; }

  const vs = `attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
  const fs = `
  precision highp float;
  uniform vec2 uRes; uniform float uTime;
  uniform vec3 uLine, uGlow;
  uniform float uScale,uRot,uRotSpeed,uLayers,uWaveAmp,uWaveFreq,uWaveSpeed,uLayerSpeed,
                uTwist,uTwistFreq,uTwistSpeed,uLineFreq,uLineSpacing,uSharp,uFalloff,
                uGlowI,uBright,uBlue,uVig,uGrain,uLight;
  float hash(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
  void main(){
    vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y;
    float a=uRot+uTime*uRotSpeed*.05;
    uv=mat2(cos(a),-sin(a),sin(a),cos(a))*uv*uScale;
    vec3 col=vec3(0.);
    for(int i=0;i<8;i++){
      float fi=float(i);
      if(fi>=uLayers) break;
      float t=uTime*(uWaveSpeed+fi*uLayerSpeed);
      vec2 q=uv;
      q.x+=sin(q.y*uTwistFreq+uTime*uTwistSpeed*.15+fi)*uTwist;
      float v=q.y*uLineFreq;
      v+=sin(q.x*uWaveFreq+t*3.+fi*1.7)*uWaveAmp*60.;
      v+=sin(q.x*uWaveFreq*.47-t*2.+fi*3.1)*uWaveAmp*35.;
      float f=fract(v/uLineSpacing+fi*.37);
      float d=min(f,1.-f);
      float line=pow(max(1.-d*2.,0.),uSharp);
      float glow=exp(-d*uFalloff);
      float ghost=.35+.65*smoothstep(-.6,1.,sin(q.x*1.1+fi*2.3+uTime*.2));
      float w=1./(1.+fi*.7);
      col+=(uLine*line*4.+uGlow*(line*.8+glow*.25)*uGlowI)*w*ghost;
    }
    col*=uBright; col.b*=uBlue;
    vec2 s=gl_FragCoord.xy/uRes-.5;
    col*=1.-uVig*smoothstep(.25,.85,length(s*vec2(1.,1.2)));
    col+=(hash(gl_FragCoord.xy+fract(uTime))-.5)*uGrain;
    col=mix(col,1.-col*.85,uLight);
    gl_FragColor=vec4(max(col,0.),1.);
  }`;

  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog); gl.useProgram(prog);

  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());

/* ---------- hologram hero: a dotted globe in spinning rings, standing behind the photo ----------
   Plain 2D canvas (cheap enough for phones). Pauses while the hero is off screen. */
function holoHero(wrap) {
  wrap.classList.add("holo-on");
  const grid = document.createElement("div"); grid.className = "holo-grid"; grid.setAttribute("aria-hidden", "true");
  const core = document.createElement("div"); core.className = "holo-core"; core.setAttribute("aria-hidden", "true");
  core.innerHTML = `<svg viewBox="0 0 200 200">
      <g class="holo-r1"><circle cx="100" cy="100" r="96" fill="none" stroke="rgba(0,240,255,.5)" stroke-width="1" stroke-dasharray="40 14 4 14"/></g>
      <g class="holo-r2"><circle cx="100" cy="100" r="86" fill="none" stroke="rgba(0,102,255,.8)" stroke-width="3" stroke-dasharray="2 5"/></g>
      <circle cx="100" cy="100" r="78" fill="none" stroke="rgba(0,240,255,.25)" stroke-width=".6"/></svg><canvas></canvas>`;
  wrap.querySelector(".fade").before(grid, core);

  const photo = wrap.querySelector(".hero-photo");

    const w = wrap.getBoundingClientRect(), r = photo && photo.getBoundingClientRect();
    const ok = r && r.width > 0, size = Math.min((ok ? r.height : w.height) * 0.82, 760);
    Object.assign(core.style, { width: size + "px",
      left: (ok ? r.left - w.left + r.width / 2 : w.width * 0.72) + "px", top: (ok ? r.top - w.top + r.height * 0.42 : w.height * 0.5) + "px" });
    canvas.width = canvas.height = Math.max(1, Math.round(size * 0.64 * dpr));
  };
  // points on a sphere; "land" is a few overlapping sine waves (decoration, not a real map)
  const pts = [];
  for (let i = 0, M = 1100; i < M; i++) {
    const y = 1 - (i + 0.5) / M * 2, rr = Math.sqrt(1 - y * y), th = i * 2.399963, x = Math.cos(th) * rr, z = Math.sin(th) * rr;

   additive, so they read as light). One scene, two canvases sized to the orbit: the back half of the ring is drawn
   on the canvas behind the photo, the front half on the one in front of it, so the logos really go round you.

  const visible = new Set();
  const io = new IntersectionObserver((es) => es.forEach((e) => e.isIntersecting ? visible.add(e.target) : visible.delete(e.target)));

  let armed = true, lastT = 0, lastAbs = 0, firedAt = 0, acc = 0;
  const api = {
    // canvas goes right after the frame's content (HS expects content first and the dim layer last); hint on the stage
    attach(stage) { panel = stage.querySelector(".hs-hall"); if (!panel) return; panel.firstChild.after(canvas); stage.append(hint); size(); },
    active: () => active && HS.on,
    edge: (dir) => (dir > 0 ? idx >= n && Math.abs(s - n) < 0.06 : idx <= 0 && Math.abs(s) < 0.06),
    push(dy) {
      const now = performance.now(), gap = now - lastT, abs = Math.abs(dy), prev = lastAbs;
      lastT = now; lastAbs = abs;
      if (!armed && (gap > 200 || (abs > prev * 1.4 + 4 && now - firedAt > 250))) armed = true;
      if (!armed) return;
      acc = gap > 250 ? dy : acc + dy;
      if (Math.abs(acc) < (FRAMES.stepThreshold || 20)) return;
      idx = clamp(idx + Math.sign(acc), 0, n); acc = 0; armed = false; firedAt = now; pushed = true;
    },
    // frames a (and a+1 while e > 0) are showing; e = transition progress
    sync(a, e, panels) {
      const isH = (p) => !!p && p.classList.contains("hs-hall");
      const A = isH(panels[a]), B = e > 0 && isH(panels[a + 1]);
      shown = A || B;
      if (e === 0) {
        tr = null;
        if (A && !active) {   // arrived: from before = glide to the door, from after = stand at the last certificate
          if (restIdx > a) { s = sPrev = n + 0.6; idx = n; } else { if (s > 0) s = sPrev = -0.6; idx = 0; }
          pushed = false;
        }
        active = A; restIdx = a; return;
      }
      active = false;
      if (!tr || tr.a !== a) tr = { a, fwd: restIdx <= a, s0: s };
      if (B) s = tr.fwd ? lerp(-1.4, -0.6, e) : lerp(-1.4, tr.s0, e);   // diving in / backing out
      else if (A) s = tr.fwd ? lerp(tr.s0, n + 1, e) : lerp(n, n + 1, e); // walking out the far end / coming back
    }
  };

  // pointer: look around a little, hover a screen, click = open the real scan in the picture viewer
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), screens = certs.map((C) => C.scr);
  addEventListener("pointermove", (e) => { if (!shown) return; const r = canvas.getBoundingClientRect(); if (!r.width) return;
    mx = (e.clientX - r.left) / r.width * 2 - 1; my = (e.clientY - r.top) / r.height * 2 - 1; }, { passive: true });
  document.addEventListener("click", (e) => {
    if (!api.active() || !hot || LB.isOpen() || e.target.closest("a, button, header, .lb")) return;
    const img = sec.querySelectorAll(".hall-grid .st-pic img")[screens.indexOf(hot)];
    if (img && img.naturalWidth) LB.open(img);
  });

  let hudK = -1;
  const setHud = (k) => {   // k = stop in front of you (1..n), or 0 = none
    if (k === hudK) return; hudK = k;
    if (!k) { hud.classList.remove("on", "swap"); return; }
    const grp = groups[k - 1], it = grp.items[0];
    hNo.innerHTML = certNo(grp, items.length);
    hName.textContent = grp.event || it.title || "";
    hList.innerHTML = grp.items.length > 1 ? grp.items.map((x) => `<li>${x.award ? "★ " : ""}${esc(x.title)}</li>`).join("") : "";
    hIss.textContent = it.issuer || ""; hNote.textContent = grp.items.map((x) => x.note).filter(has).join(" · ");
    hud.classList.remove("swap"); void hud.offsetWidth; hud.classList.add("on", "swap");
  };

  const look = new THREE.Vector3(), right = new THREE.Vector3();
  let last = performance.now(), time = 0, shift = 0.12;
  const loop = (now) => {
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    canvas.style.display = shown ? "block" : "none";
    if (!shown || !canvas.isConnected) return;
    if (!W) size();
    time += dt;
    if (active) s += (idx - s) * Math.min(1, dt * 2.4);
    const v = (s - sPrev) / Math.max(dt, 1e-3); sPrev = s;
    const spd = clamp(Math.abs(v) / 1.6, 0, 1);
    // camera on the path; the pointer turns the head a little
    lmx += (mx - lmx) * 0.06; lmy += (my - lmy) * 0.06;
    camera.position.copy(at(eyeCurve, s)); look.copy(at(lookCurve, s));
    right.subVectors(look, camera.position).cross(camera.up).normalize();
    camera.position.addScaledVector(right, lmx * 0.25).y -= lmy * 0.15;
    look.addScaledVector(right, lmx * 0.9).y -= lmy * 0.5;
    camera.lookAt(look);
    camera.fov = 50 + spd * 16;
    // inside the hall the view shifts so the certificate sits right of the HUD (a pair is wider: shift more)
    const off = smooth(0.4, 1, s) * (1 - smooth(n, n + 0.8, s)), g0 = groups[clamp(Math.round(s), 1, n) - 1];
    shift += ((g0 && g0.items.length > 1 ? 0.18 : 0.12) - shift) * Math.min(1, dt * 3);
    camera.setViewOffset(W, H, -W * shift * off, 0, W, H); camera.updateProjectionMatrix();
    floorMat.uniforms.uTime.value = time;
    arches.forEach((A, k) => { A.dash.rotation.z = Math.sin(time * 0.4 + k) * 0.25; });
    // hover (only while the frame is at rest)
    if (api.active() && !LB.isOpen()) { ndc.set(mx, -my); ray.setFromCamera(ndc, camera); const h = ray.intersectObjects(screens, false)[0]; hot = h && h.distance < 14 ? h.object : null; }
    else hot = null;
    if (panel) panel.style.cursor = hot ? "zoom-in" : "";
    const near = Math.round(s), focus = clamp(1 - Math.abs(s - near) / 0.35, 0, 1);
    for (const C of certs) {
      const me = near === C.stop ? focus : 0;
      C.hover += ((hot === C.scr ? 1 : 0) - C.hover) * 0.15;
      C.holo += ((hot === C.scr ? 0.05 : lerp(0.85, 0.35, me)) - C.holo) * 0.1;
      const U = C.mat.uniforms; U.uHolo.value = C.holo; U.uTime.value = time + C.ph * 3.1;
      C.scr.position.y = 0.98 + C.h / 2 + Math.sin(time * 1.1 + C.ph) * 0.05;
      const z = 1 + C.hover * 0.04; C.scr.scale.set(C.w * z, C.h * z, 1);
      C.beam.material.uniforms.uTime.value = time; C.beam.material.uniforms.uOp.value = 0.7 + 0.5 * me;
      C.arc.rotation.z = time * (0.6 + 0.4 * me) + C.ph;
    }
    // heading moves to the corner inside the hall; HUD names the certificate in front of you
    sec.classList.toggle("in-hall", s > 0.5 && s < n + 0.5);
    setHud(api.active() && near >= 1 && near <= n && focus > 0.4 ? near : 0);
    const msg = !api.active() ? "" : idx >= n && s > n - 0.3 ? c.hintEnd : !pushed ? c.hint : "";
    if (msg && hint.innerHTML !== msg) hint.innerHTML = msg;
    hint.classList.toggle("on", !!msg);
    renderer.render(scene, camera);
  };
  requestAnimationFrame(loop);
  return api;
}
hallOfFame().then((api) => {
  if (!api) { document.documentElement.classList.add("hall-fail"); return; }   // no 3D hall: frames mode shows the cards in a row
  HALL = api; document.documentElement.classList.add("hall-on");
  const st = document.getElementById("hs-sticky"); if (st) api.attach(st);
  if (HS.on) HS.refresh();
}).catch((e) => { console.error("[hall]", e); document.documentElement.classList.add("hall-fail"); });

/* ---------- scroll tracking: progress bar + active section in nav ---------- */
(() => {
  const bar = document.getElementById("progress");
  const links = [...document.querySelectorAll(".nav-link")];
  const ids = [...new Set(links.map((a) => a.dataset.target))];
  const secs = ids.map((id) => document.getElementById(id)).filter(Boolean);
  let current = null, ticking = false;

  const update = () => {
    ticking = false;
    const doc = document.documentElement;
    const max = doc.scrollHeight - window.innerHeight;
    const y = window.scrollY;
    bar.style.transform = `scaleX(${max > 0 ? Math.min(1, y / max) : 0})`;

    // frames: the tab of the frame on screen (none on story/contact frames);
    // normal scroll: the last tabbed section whose top has passed 35% of the screen
    let id = null;
    if (HS.on) id = HS.activeId();
    else { const line = window.innerHeight * 0.35;
      for (const s of secs) if (s.getBoundingClientRect().top <= line) id = s.id; }

    if (id !== current) {
      current = id;
      links.forEach((a) => {
        const on = a.dataset.target === id;
        a.classList.toggle("active", on);
        if (on) a.setAttribute("aria-current", "location"); else a.removeAttribute("aria-current");
      });
    }
  };
  const onScroll = () => { if (!ticking) { ticking = true; requestAnimationFrame(update); } };
  window.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("resize", onScroll);
  update();
})();

/* ---------- scroll reveal ---------- */
(() => {
  const els = document.querySelectorAll("#app section > div:first-child, #app section > div:not(:first-child) > *, #app .relative.pl-6 > div");
  els.forEach((el, i) => { el.classList.add("reveal"); el.style.transitionDelay = (i % 3) * 90 + "ms"; });
  if (!("IntersectionObserver" in window)) { els.forEach((el) => el.classList.add("in")); return; }
  const io = new IntersectionObserver((es) => es.forEach((e) => {
    if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
  }), { threshold: 0.12, rootMargin: "0px 0px -40px 0px" });
  els.forEach((el) => io.observe(el));

  // project galleries in normal scrolling (phones): play the intro when the frame is mostly on screen
  const io2 = new IntersectionObserver((es) => es.forEach((e) => {
    if (!HS.on && e.isIntersecting) { e.target.classList.add("st-play"); io2.unobserve(e.target); }
  }), { threshold: 0.35 });
  document.querySelectorAll(".story .st-gallery").forEach((g) => io2.observe(g.closest(".story")));
})();
</script>
